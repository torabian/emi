services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: emi
      POSTGRES_PASSWORD: emi
      POSTGRES_DB: emi_entity_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emi -d emi_entity_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: emi
      MYSQL_DATABASE: emi_entity_test
      MYSQL_USER: emi
      MYSQL_PASSWORD: emi
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pemi"]
      interval: 2s
      timeout: 3s
      retries: 30
