actions:
- name: entity1Create
  url: /entity1
  method: post
  description: Creates a new "entity1" row.
  in:
    dto: Entity1Dto
  out:
    envelope: GResponse
    dto: Entity1Dto
- name: entity1Update
  url: /entity1/:id string
  method: patch
  description: Applies a partial update to a "entity1" row by uniqueId.
  in:
    dto: Entity1OptionalDto
  out:
    envelope: GResponse
    dto: Entity1Dto
- name: entity1Get
  url: /entity1/:id string
  method: get
  description: Looks up a single "entity1" row by uniqueId.
  out:
    envelope: GResponse
    dto: Entity1Dto
- name: entity1Browse
  url: /entity1/browse
  method: get
  qs:
  - name: filter
    type: string
  - name: sort
    type: string
  - name: startIndex
    type: int
  - name: itemsPerPage
    type: int
  - name: cursor
    type: string
  description: Returns "entity1" rows matching a filter, sorted/paged (see emigorm.QueryDSL).
  out:
    envelope: GResponse
    dto: Entity1OptionalDto
- name: entity1AwareDeletePreview
  url: /entity1/delete-preview
  method: get
  qs:
  - name: uniqueIds
    type: slice
    primitive: string
  description: Reports what deleting the given "entity1" uniqueIds would affect, without
    deleting anything.
  out:
    envelope: GResponse
    fields:
    - name: message
      type: string
    - name: affected
      type: array
      fields:
      - name: relation
        type: string
      - name: count
        type: int64
- name: entity1AwareDelete
  url: /entity1/delete
  method: post
  description: Deletes the given "entity1" uniqueIds, along with everything entity1AwareDeletePreview
    reports.
  in:
    fields:
    - name: uniqueIds
      type: slice
      primitive: string
